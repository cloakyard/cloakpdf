<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title description" data-logo-spec="cloakyard-mark-v2">
  <title id="title">CloakPDF</title>
  <desc id="description">A white folded report on a blue enamel disc, with printed lines and a two-column table.</desc>
  <defs>
    <linearGradient id="enamel" x1=".19" y1="0" x2=".75" y2="1">
      <stop offset="0" stop-color="#83c8ff"/>
      <stop offset=".47" stop-color="#327de5"/>
      <stop offset="1" stop-color="#194db0"/>
    </linearGradient>
    <linearGradient id="rim" x1=".24" y1="0" x2=".76" y2="1">
      <stop stop-color="#fff" stop-opacity=".88"/>
      <stop offset=".39" stop-color="#fff" stop-opacity=".08"/>
      <stop offset=".7" stop-color="#0a1540" stop-opacity=".24"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".46"/>
    </linearGradient>
    <radialGradient id="bloom" cx=".24" cy=".16" r=".8">
      <stop stop-color="#fff" stop-opacity=".27"/>
      <stop offset=".68" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stock" x1="0" y1="0" x2=".72" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.68" stop-color="#fff"/>
      <stop offset="1" stop-color="#e6e9ec"/>
    </linearGradient>
    <filter id="cast" x="-25%" y="-20%" width="150%" height="155%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <style>
      @media (prefers-color-scheme: dark) {
        [stop-color="#83c8ff"] { stop-color: #599cce }
        [stop-color="#327de5"] { stop-color: #285c9a }
        [stop-color="#194db0"] { stop-color: #1c3870 }
        [fill="#2253af"] { fill: #1d447f }
        [stroke="#183b7b"] { stroke: #112a51 }
        [stroke="#5989df"] { stroke: #4d79bb }
        [stroke="#163675"] { stroke: #183970 }
        [stroke="#6783aa"] { stroke: #637fa9 }
        [fill="#eef4fb"] { fill: #e2ecf7 }
        [stroke="#335da5"] { stroke: #315995 }
        [fill="#335da5"] { fill: #315995 }
        [stroke="#eef4fb"] { stroke: #e2ecf7 }
      }
    </style>
  </defs>
  <g id="disc">
    <circle id="disc-base" cx="32" cy="32" r="30" fill="url(#enamel)"/>
    <circle id="disc-rim" cx="32" cy="32" r="29.5" fill="url(#bloom)" stroke="url(#rim)" stroke-width="1"/>
  </g>
  <g id="artwork">
    <g id="ground" transform="translate(32.25 32) scale(.22) translate(-128 -128)">
      <g transform="rotate(-8 128 128)">
        <rect x="60" y="53" width="138" height="163" rx="10" fill="#17345f" opacity=".2" filter="url(#cast)"/>
        <rect x="59" y="49" width="137" height="164" rx="9" fill="#2253af" stroke="#183b7b" stroke-width="2"/>
        <path d="M67 206h118" fill="none" stroke="#5989df" stroke-width="2"/>
      </g>
    </g>
    <g id="page" transform="translate(32.25 32) scale(.22) translate(-128 -128)">
      <g transform="rotate(4 128 128)">
        <path d="M65 41h98l32 32v130a8 8 0 0 1-8 8H65a8 8 0 0 1-8-8V49a8 8 0 0 1 8-8Z" transform="translate(1 4)" fill="#142e59" opacity=".28" filter="url(#cast)"/>
        <path d="M65 41h98l32 32v130a8 8 0 0 1-8 8H65a8 8 0 0 1-8-8V49a8 8 0 0 1 8-8Z" transform="translate(0 2)" fill="#a0a9b1" stroke="#a0a9b1" stroke-width="1.5"/>
        <path d="M65 41h98l32 32v130a8 8 0 0 1-8 8H65a8 8 0 0 1-8-8V49a8 8 0 0 1 8-8Z" fill="url(#stock)" stroke="#a0a9b1" stroke-width="1.5"/>
        <path d="M163 42v23a8 8 0 0 0 8 8h23" fill="#d9dfe4" stroke="#a0a9b1" stroke-width="1.5" stroke-linejoin="round"/>
      </g>
    </g>
    <g id="print" transform="translate(32.25 32) scale(.22) translate(-128 -128)">
      <g transform="rotate(4 128 128)">
        <path d="M77 70h47" stroke="#163675" stroke-width="7" stroke-linecap="round"/>
        <path d="M77 88h69" stroke="#6783aa" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M77 99h49" stroke="#6783aa" stroke-width="4.5" stroke-linecap="round"/>
        <rect x="75" y="121" width="99" height="57" rx="2" fill="#eef4fb" stroke="#335da5" stroke-width="3.5"/>
        <path d="M75 134v-11q0-2 2-2h95q2 0 2 2v11Z" fill="#335da5"/>
        <path d="M134 134v44M75 156h99" fill="none" stroke="#335da5" stroke-width="3.5"/>
        <path d="M134 122v12" stroke="#eef4fb" stroke-width="2.8"/>
      </g>
    </g>
  </g>
</svg>
