<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" role="img" aria-labelledby="title description" data-logo-spec="cloakyard-mark-v2">
  <title id="title">CloakPDF</title>
  <desc id="description">A white folded report on a blue enamel disc, with printed lines and a two-column table.</desc>
  <defs>
    <linearGradient id="enamel" x1=".19" y1="0" x2=".75" y2="1">
      <stop offset="0" stop-color="#83c8ff"/>
      <stop offset=".47" stop-color="#327de5"/>
      <stop offset="1" stop-color="#194db0"/>
    </linearGradient>
    <style>
      @media (prefers-color-scheme: dark) {
        [stop-color="#83c8ff"] { stop-color: #599cce }
        [stop-color="#327de5"] { stop-color: #285c9a }
        [stop-color="#194db0"] { stop-color: #1c3870 }
      }
    </style>
  </defs>
  <g id="disc">
    <circle id="disc-base" cx="8" cy="8" r="7.5" fill="url(#enamel)"/>
  </g>
  <g id="artwork">
    <g id="ground">
      <path d="m3.8 4.4 5.6-1 .3 1.7 1.5.1.7 6.5-6.7 1.05Z" fill="#173a78"/>
    </g>
    <g id="page">
      <path d="M5 3h4.6l2.05 2.05V13H5Z" fill="#fff"/>
      <path d="M9.6 3.1v2.2h2" fill="#d9dfe4"/>
    </g>
    <g id="print">
      <path d="M6.1 5.25h2.25M6.1 6.6h3.6" stroke="#345078" stroke-width=".75" stroke-linecap="round"/>
      <path d="M6.1 8.1h4.5v3.5H6.1Zm2.65 0v3.5M6.1 9.8h4.5" fill="none" stroke="#315186" stroke-width=".75"/>
    </g>
  </g>
