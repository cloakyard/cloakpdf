<!doctype html>
<html lang="en" data-air-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>__NAME__ social artwork</title>
    <style>
      __AIR_CSS__
    </style>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: var(--air-page);
        color: var(--air-ink);
        font-family: var(--air-font);
      }
      header {
        position: absolute;
        inset: 48px 56px auto;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 24px;
        font-weight: 500;
        letter-spacing: -0.03em;
      }
      header img {
        width: 36px;
        height: 36px;
      }
      header span {
        margin-left: auto;
        color: var(--air-ink-secondary);
        font-size: 18px;
        font-weight: 400;
        letter-spacing: 0;
      }
      main {
        position: absolute;
        inset: 148px 56px auto;
        height: 352px;
        display: grid;
        grid-template-columns: 544px 480px;
        gap: 64px;
        align-items: center;
      }
      h1 {
        margin: 0 0 28px;
        font-size: 64px;
        font-weight: 400;
        line-height: 1.08;
        letter-spacing: -0.055em;
      }
      h1 span {
        display: block;
        color: var(--air-ink-secondary);
      }
      p {
        margin: 0;
        max-width: 40ch;
        color: var(--air-ink-secondary);
        font-size: 22px;
        line-height: 1.5;
      }
      .artwork {
        display: block;
        width: 480px;
        height: 328px;
        object-fit: contain;
      }
      footer {
        position: absolute;
        inset: auto 56px 40px;
        padding-top: 24px;
        border-top: 1px solid var(--air-line);
        color: var(--air-ink-secondary);
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="__LOGO__" alt="" width="36" height="36" />__NAME__<span>__HOST__</span>
    </header>
    <main>
      <div>
        <h1>__TITLE__<span>__SUBTITLE__</span></h1>
        <p>__DESCRIPTION__</p>
      </div>
      <img class="artwork" src="__ARTWORK__" width="480" height="328" alt="__ART_ALT__" />
    </main>
    <footer>Private by nature. Open by choice.</footer>
  </body>
</html>
