name: Air design contract
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: node scripts/check-air-design.mjs
      - run: node scripts/air-inventory.mjs
      - run: git diff --exit-code -- docs/air/surfaces.json docs/air/surface-inventory.md
