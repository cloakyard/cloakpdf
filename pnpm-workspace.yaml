allowBuilds:
  # Node-only backends and funding hooks are not needed by this browser app.
  onnxruntime-node: false
  protobufjs: false
  tesseract.js: false

minimumReleaseAgeExclude:
  - "@huggingface/transformers@4.3.1"
  - "@langchain/core@1.2.17"
  - "@langchain/langgraph@1.4.20"
  - knip@6.40.0
  - "@puppeteer/browsers@3.2.2"
  - "@types/react-dom@19.2.7"
  - lucide-react@1.40.0
  - puppeteer-core@25.10.0
  - "@voidzero-dev/vite-plus-core@1.1.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.1.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.1.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.1.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.1.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.1.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.1.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.1.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.1.0"
  - vite-plus@1.1.0
  - "@langchain/langgraph-checkpoint@1.1.6"
  - "@langchain/langgraph-sdk@1.12.2"

# pnpm 10 reads dependency overrides from here (no longer from package.json's
# "pnpm.overrides", which it silently ignores). `vite` is remapped to the Vite+
# core drop-in; vitest is now the real package bundled by Vite+ 0.3.x (no alias).
# The rest pin transitive deps past known advisories:
#   - serialize-javascript >=7.0.3  (XSS, GHSA-76p7-773f-r4q5)
#   - form-data >=4.0.6             (unsafe boundary, GHSA-hmw2-7cc7-3qxx)
#   - adm-zip >=0.6.0               (path traversal, GHSA-xcpc-8h2w-3j85;
#     transitive via onnxruntime-node → @huggingface/transformers, Node-only —
#     never in the browser bundle, but flagged by the CI osv-scanner audit)
#   - glob >=13                      (glob 11 is deprecated; Workbox supports
#     the same promise API on the maintained Node 22+ major)
#   - global-agent >=4              (global-agent 3 pulls deprecated boolean;
#     this Node-only proxy helper keeps the same bootstrap API)
#   - sharp >=0.35.3                 (libvips memory-safety fixes,
#     GHSA-f88m-g3jw-g9cj)
#   - brace-expansion >=5.0.9        (unbounded expansion DoS,
#     GHSA-mh99-v99m-4gvg)
overrides:
  serialize-javascript: ">=7.0.3"
  form-data: ">=4.0.6"
  adm-zip: ">=0.6.0"
  glob: ">=13.0.6"
  global-agent: ">=4.1.3"
  sharp: "^0.35.5"
  brace-expansion: ">=5.0.9"
  vite@*: "catalog:"

# Vite+ is installed as a versioned Vite-compatible alias and bundles the
# matching Vitest toolchain, so their semver metadata does not reflect API
# compatibility with the packages that consume them.
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
