allowBuilds:
  # Node-only backends and funding hooks are not needed by this browser app.
  onnxruntime-node: false
  protobufjs: false
  tesseract.js: false

# Dependency overrides are read from this workspace file. `vite` maps to the
# Vite+ core drop-in; Vitest is the real package bundled by Vite+.
# The rest pin transitive deps past known advisories:
#   - serialize-javascript >=7.1.4  (XSS, GHSA-m5mm-p8h7-m29v)
#   - form-data >=4.0.6             (unsafe boundary, GHSA-hmw2-7cc7-3qxx)
#   - adm-zip >=0.6.0               (path traversal, GHSA-xcpc-8h2w-3j85;
#     transitive via onnxruntime-node → @huggingface/transformers, Node-only —
#     never in the browser bundle, but flagged by the CI osv-scanner audit)
#   - glob >=13                      (glob 11 is deprecated; Workbox supports
#     the same promise API on the maintained Node 22+ major)
#   - global-agent >=4              (global-agent 3 pulls deprecated boolean;
#     this Node-only proxy helper keeps the same bootstrap API)
#   - sharp >=0.35.3                 (libvips memory-safety fixes,
#     GHSA-f88m-g3jw-g9cj)
#   - brace-expansion >=5.0.9        (unbounded expansion DoS,
#     GHSA-mh99-v99m-4gvg)
overrides:
  # Pinned node-resolve patch clones its fixed defaults with Node structuredClone.
  # Remove this override and patch when upstream drops deepmerge (GHSA-gcqx-w48m-w2h4).
  "@rollup/plugin-node-resolve@16.0.3>deepmerge": "-"
  serialize-javascript: ">=7.1.4"
  form-data: ">=4.0.6"
  adm-zip: ">=0.6.0"
  glob: ">=13.0.6"
  global-agent: ">=4.1.6"
  sharp: "^0.35.5"
  brace-expansion: ">=5.0.9"
  vite@*: "catalog:"

# Vite+ is installed as a versioned Vite-compatible alias and bundles the
# matching Vitest toolchain, so their semver metadata does not reflect API
# compatibility with the packages that consume them.
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
minimumReleaseAgeExclude:
  - "@langchain/core@1.3.0"
  - "@pdfme/pdf-lib@6.2.8"
  - framer-motion@14.6.0
  - lucide-react@1.61.0
  - motion-dom@14.6.0
  - motion@14.6.0
  - puppeteer-core@25.16.0
  - serialize-javascript@7.1.4
patchedDependencies:
  "@rollup/plugin-node-resolve@16.0.3": patches/@rollup__plugin-node-resolve@16.0.3.patch
